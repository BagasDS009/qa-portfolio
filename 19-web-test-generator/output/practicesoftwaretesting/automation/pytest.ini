[pytest]
markers =
    smoke: Quick sanity tests — critical path only (< 3 min, 9 tests)
    wave1: Wave 1 full — all priority tests (< 10 min, 30 tests)
    regression: Full regression suite (< 15 min)
    critical: Must-pass for release
    negative: Error handling and validation tests
    edge: Boundary and unusual input tests
    login: Authentication tests
    registration: User registration tests
    search: Product search and filter tests
    cart: Shopping cart tests
    checkout: Checkout flow tests
    contact: Contact form tests
    a11y: Accessibility compliance tests
    visual: Visual regression tests
    api: API intercept and validation tests
    performance: Performance budget tests

addopts = --strict-markers --reruns=2 --reruns-delay=1 --browser firefox --alluredir=reports/allure-results --clean-alluredir
testpaths = tests
