[pytest]
markers =
    smoke: Quick sanity tests — critical path only (< 3 min)
    wave1: Wave 1 — all priority functional tests (< 10 min)
    e2e: End-to-end flow tests (require full booking chain)
    regression: Full regression suite
    critical: Must-pass for release
    negative: Error handling and validation tests
    edge: Boundary and unusual input tests
    search: Train search tests
    login: Authentication tests
    passenger: Passenger data form tests
    seat: Seat selection tests
    payment: Payment page tests
    a11y: Accessibility tests

addopts = --strict-markers --reruns=2 --reruns-delay=1 --browser firefox --alluredir=reports/allure-results --clean-alluredir
testpaths = tests
