# ZAP Scan Rules Configuration
# Format: <rule_id> <action> (IGNORE, WARN, FAIL)
#
# Common rules to customize for CI pipelines:

# Informational findings - don't fail the build
10015	IGNORE	# Incomplete or No Cache-control Header Set
10021	IGNORE	# X-Content-Type-Options Header Missing (informational)
10036	IGNORE	# Server Leaks Version Information via "Server" HTTP Response Header Field

# Warnings - report but don't fail
10010	WARN	# Cookie No HttpOnly Flag
10011	WARN	# Cookie Without Secure Flag
10017	WARN	# Cross-Domain JavaScript Source File Inclusion
10020	WARN	# X-Frame-Options Header Not Set
10038	WARN	# Content Security Policy (CSP) Header Not Set

# Failures - these should block deployment
40012	FAIL	# Cross Site Scripting (XSS) - Reflected
40014	FAIL	# Cross Site Scripting (XSS) - Persistent
40018	FAIL	# SQL Injection
40019	FAIL	# SQL Injection (MySQL)
90019	FAIL	# Server Side Code Injection
90020	FAIL	# Remote OS Command Injection
