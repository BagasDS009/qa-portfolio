name: Mobile Tests (Playwright) - Device Emulation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mobile-playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install flake8
      - name: Run flake8
        working-directory: 09-mobile-web-testing
        run: |
          flake8 tests/ conftest.py \
            --max-line-length=120 \
            --ignore=E501,W503,F401,E402,F541,E302,E303,W293,E301 \
            --count --statistics

  test:
    name: Run Mobile Tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 09-mobile-web-testing/requirements.txt

      - name: Install dependencies
        working-directory: 09-mobile-web-testing
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Tests
        working-directory: 09-mobile-web-testing
        run: |
          pytest tests/ -v \
            --alluredir=reports/allure-results \
            --html=reports/report.html \
            --self-contained-html

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-results
          path: 09-mobile-web-testing/reports/
          retention-days: 14
