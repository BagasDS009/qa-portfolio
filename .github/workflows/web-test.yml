name: Web Automation Tests - KAI Booking

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-search:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: 01-web-automation-playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        working-directory: 01-web-automation-playwright
        run: playwright install --with-deps chromium

      - name: Run test_search.py
        working-directory: 01-web-automation-playwright
        run: |
          pytest tests/test_search.py -v \
            --alluredir=reports/allure-results \
            --html=reports/report-search.html \
            --self-contained-html

      - name: Generate Allure Report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: 01-web-automation-playwright/reports/allure-results
          allure_report: 01-web-automation-playwright/reports/allure-report

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: 01-web-automation-playwright/reports/allure-report
          retention-days: 14

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: 01-web-automation-playwright/reports/report-search.html
          retention-days: 14

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: 01-web-automation-playwright/reports/screenshots/
          retention-days: 7
