name: Web Automation Tests - KAI Booking

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: 01-web-automation-playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Install Playwright browsers
        working-directory: 01-web-automation-playwright
        run: playwright install --with-deps chromium

      - name: Lint (flake8)
        working-directory: 01-web-automation-playwright
        run: |
          flake8 pages/ tests/ conftest.py \
            --max-line-length=120 \
            --ignore=E501,W503,F401 \
            --count --statistics

      - name: Run Tests
        working-directory: 01-web-automation-playwright
        run: |
          pytest tests/test_search.py -v \
            --alluredir=reports/allure-results \
            --html=reports/report.html \
            --self-contained-html \
            || true

      - name: Generate Allure Report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: 01-web-automation-playwright/reports/allure-results
          allure_report: 01-web-automation-playwright/reports/allure-report

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-allure-report
          path: 01-web-automation-playwright/reports/allure-report
          retention-days: 14

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-html-report
          path: 01-web-automation-playwright/reports/report.html
          retention-days: 14

      - name: Upload screenshots on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-failure-screenshots
          path: 01-web-automation-playwright/reports/screenshots/
          retention-days: 7

      - name: Test Results Summary
        if: always()
        working-directory: 01-web-automation-playwright
        run: |
          echo "============================================"
          echo "📊 WEB TEST RESULTS SUMMARY"
          echo "============================================"
          echo "Target: booking.kai.id (Cloudflare WAF)"
          echo "Note: Partial failures expected due to WAF"
          echo "============================================"
