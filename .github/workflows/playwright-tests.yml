name: Playwright Tests (Python) - All Projects

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: playwright-all-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install flake8
      - name: Lint Web Automation
        working-directory: 01-web-automation-playwright
        run: |
          flake8 pages/ tests/ conftest.py \
            --max-line-length=120 \
            --ignore=E501,W503,F401,E302,E303,W291,W293,F541,E301 \
            --count --statistics
      - name: Lint API Testing
        working-directory: 06-api-testing-playwright
        run: |
          flake8 tests/ conftest.py \
            --max-line-length=120 \
            --ignore=E501,W503,F401,E402,F541,W293,E301,E302,E303 \
            --count --statistics
      - name: Lint Mobile Testing
        working-directory: 09-mobile-web-testing
        run: |
          flake8 tests/ conftest.py \
            --max-line-length=120 \
            --ignore=E501,W503,F401,E402,F541,E302,E303,W293,E301 \
            --count --statistics

  web-test:
    name: Web Automation (01)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 01-web-automation-playwright/requirements.txt

      - name: Install dependencies
        working-directory: 01-web-automation-playwright
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Tests
        working-directory: 01-web-automation-playwright
        run: |
          pytest tests/ -v \
            --alluredir=reports/allure-results \
            --html=reports/report.html \
            --self-contained-html \
            || true

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-playwright-results
          path: 01-web-automation-playwright/reports/
          retention-days: 14

  api-test-playwright:
    name: API Test Playwright (06)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 06-api-testing-playwright/requirements.txt

      - name: Install dependencies
        working-directory: 06-api-testing-playwright
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Tests
        working-directory: 06-api-testing-playwright
        run: |
          pytest tests/ -v \
            --alluredir=reports/allure-results \
            --html=reports/report.html \
            --self-contained-html

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-playwright-results
          path: 06-api-testing-playwright/reports/
          retention-days: 14

  mobile-web-test:
    name: Mobile Web Test (09)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 09-mobile-web-testing/requirements.txt

      - name: Install dependencies
        working-directory: 09-mobile-web-testing
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Tests
        working-directory: 09-mobile-web-testing
        run: |
          pytest tests/ -v \
            --alluredir=reports/allure-results \
            --html=reports/report.html \
            --self-contained-html

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-playwright-results
          path: 09-mobile-web-testing/reports/
          retention-days: 14
