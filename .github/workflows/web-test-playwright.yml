name: Web Automation Tests - KAI Booking

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install flake8
        run: pip install flake8

      - name: Run Lint
        working-directory: 01-web-automation-playwright
        run: |
          flake8 pages/ tests/ conftest.py \
            --max-line-length=120 \
            --ignore=E501,W503,F401,E302,E303,W291 \
            --count --statistics

  test-search:
    name: Search Tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: 01-web-automation-playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        working-directory: 01-web-automation-playwright
        run: playwright install --with-deps chromium

      - name: Run Search Tests
        working-directory: 01-web-automation-playwright
        run: |
          pytest tests/test_search.py -v \
            --alluredir=reports/allure-results \
            --html=reports/report-search.html \
            --self-contained-html \
            || true

      - name: Upload Search Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-test-report
          path: |
            01-web-automation-playwright/reports/report-search.html
            01-web-automation-playwright/reports/allure-results/
          retention-days: 14

  test-validation:
    name: Validation Tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: 01-web-automation-playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        working-directory: 01-web-automation-playwright
        run: playwright install --with-deps chromium

      - name: Run Validation Tests
        working-directory: 01-web-automation-playwright
        run: |
          pytest tests/test_validation.py -v \
            --alluredir=reports/allure-results \
            --html=reports/report-validation.html \
            --self-contained-html \
            || true

      - name: Upload Validation Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-test-report
          path: |
            01-web-automation-playwright/reports/report-validation.html
            01-web-automation-playwright/reports/allure-results/
          retention-days: 14

  report:
    name: Generate Allure Report
    runs-on: ubuntu-latest
    needs: [test-search, test-validation]
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Search Results
        uses: actions/download-artifact@v4
        with:
          name: search-test-report
          path: allure-results/search

      - name: Download Validation Results
        uses: actions/download-artifact@v4
        with:
          name: validation-test-report
          path: allure-results/validation

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_report: allure-report

      - name: Upload Final Allure Report
        uses: actions/upload-artifact@v4
        with:
          name: web-allure-report
          path: allure-report
          retention-days: 14

      - name: Test Results Summary
        run: |
          echo "============================================"
          echo "📊 WEB TEST RESULTS SUMMARY"
          echo "============================================"
          echo "Target   : booking.kai.id"
          echo "Suites   : test_search.py, test_validation.py"
          echo "Note     : Partial failures expected (Cloudflare WAF)"
          echo "============================================"
