name: Web Tests (Playwright) - KAI Booking

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: web-playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install flake8
      - name: Run flake8
        working-directory: 01-web-automation-playwright
        run: |
          flake8 pages/ tests/ conftest.py \
            --max-line-length=120 \
            --ignore=E501,W503,F401,E302,E303,W291,W293,F541,E301 \
            --count --statistics

  test-search:
    name: Search Tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 01-web-automation-playwright/requirements.txt

      - name: Install dependencies
        working-directory: 01-web-automation-playwright
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Search Tests
        working-directory: 01-web-automation-playwright
        run: |
          pytest tests/test_search.py -v \
            --alluredir=reports/allure-results \
            --html=reports/report-search.html \
            --self-contained-html \
            || true

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-search-results
          path: |
            01-web-automation-playwright/reports/
          retention-days: 14

  test-validation:
    name: Validation Tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 01-web-automation-playwright/requirements.txt

      - name: Install dependencies
        working-directory: 01-web-automation-playwright
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Validation Tests
        working-directory: 01-web-automation-playwright
        run: |
          pytest tests/test_validation.py -v \
            --alluredir=reports/allure-results \
            --html=reports/report-validation.html \
            --self-contained-html \
            || true

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-validation-results
          path: |
            01-web-automation-playwright/reports/
          retention-days: 14
