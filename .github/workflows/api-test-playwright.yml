name: API Automation Tests - FakeREST API

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: 06-api-testing-playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Install Playwright
        working-directory: 06-api-testing-playwright
        run: playwright install --with-deps chromium

      - name: Lint (flake8)
        working-directory: 06-api-testing-playwright
        run: |
          flake8 tests/ conftest.py \
            --max-line-length=120 \
            --ignore=E501,W503,F401,E402,F541 \
            --count --statistics

      - name: Run Tests
        working-directory: 06-api-testing-playwright
        run: |
          pytest tests/ -v \
            --alluredir=reports/allure-results \
            --html=reports/report.html \
            --self-contained-html

      - name: Generate Allure Report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: 06-api-testing-playwright/reports/allure-results
          allure_report: 06-api-testing-playwright/reports/allure-report

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-allure-report
          path: 06-api-testing-playwright/reports/allure-report
          retention-days: 14

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-html-report
          path: 06-api-testing-playwright/reports/report.html
          retention-days: 14

      - name: Test Results Summary
        if: always()
        working-directory: 06-api-testing-playwright
        run: |
          echo "============================================"
          echo "📊 API TEST RESULTS SUMMARY"
          echo "============================================"
          echo "Target: fakerestapi.azurewebsites.net"
          echo "Resources: Activities, Authors, Books, Users"
          echo "Expected: All 22 tests PASS"
          echo "============================================"
