name: API Tests (Playwright) - FakeREST API

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: api-playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install flake8
      - name: Run flake8
        working-directory: 06-api-testing-playwright
        run: |
          flake8 tests/ conftest.py \
            --max-line-length=120 \
            --ignore=E501,W503,F401,E402,F541,W293,E301,E302,E303 \
            --count --statistics

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 06-api-testing-playwright/requirements.txt

      - name: Install dependencies
        working-directory: 06-api-testing-playwright
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Tests
        working-directory: 06-api-testing-playwright
        run: |
          pytest tests/ -v \
            --alluredir=reports/allure-results \
            --html=reports/report.html \
            --self-contained-html

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-playwright-allure-results
          path: 06-api-testing-playwright/reports/allure-results
          retention-days: 14

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-playwright-html-report
          path: 06-api-testing-playwright/reports/report.html
          retention-days: 14
