name: API Tests (Cypress) - FakeREST API

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: api-cypress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 08-api-test-cypress/package-lock.json

      - name: Install dependencies
        working-directory: 08-api-test-cypress
        run: npm ci

      - name: Run Cypress API Tests
        working-directory: 08-api-test-cypress
        run: npx cypress run

      - name: Upload Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-cypress-videos
          path: 08-api-test-cypress/cypress/videos/
          retention-days: 7

      - name: Upload Screenshots on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-cypress-screenshots
          path: 08-api-test-cypress/cypress/screenshots/
          retention-days: 7
