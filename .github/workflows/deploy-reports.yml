name: Deploy Allure Reports to GitHub Pages

on:
  workflow_run:
    workflows:
      - "Playwright Tests (Python) - All Projects"
      - "Cypress Tests (JavaScript) - API"
      - "Selenium Tests (Java) - All Projects"
      - "Performance, Security & Visual Tests"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy All Reports
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Download API Playwright Results
        uses: dawidd6/action-download-artifact@v3.1.4
        with:
          workflow: playwright-tests.yml
          name: api-playwright-results
          path: allure-results/api-playwright
        continue-on-error: true

      - name: Download Mobile Results
        uses: dawidd6/action-download-artifact@v3.1.4
        with:
          workflow: playwright-tests.yml
          name: mobile-playwright-results
          path: allure-results/mobile
        continue-on-error: true

      - name: Download Web Playwright Results
        uses: dawidd6/action-download-artifact@v3.1.4
        with:
          workflow: playwright-tests.yml
          name: web-playwright-results
          path: allure-results/web-playwright
        continue-on-error: true

      - name: Download Selenium Web Results
        uses: dawidd6/action-download-artifact@v3.1.4
        with:
          workflow: selenium-tests.yml
          name: web-selenium-allure-results
          path: allure-results/web-selenium
        continue-on-error: true

      - name: Download Selenium API Results
        uses: dawidd6/action-download-artifact@v3.1.4
        with:
          workflow: selenium-tests.yml
          name: api-selenium-allure-results
          path: allure-results/api-selenium
        continue-on-error: true

      - name: Download Selenium Mobile Results
        uses: dawidd6/action-download-artifact@v3.1.4
        with:
          workflow: selenium-tests.yml
          name: mobile-selenium-allure-results
          path: allure-results/mobile-selenium
        continue-on-error: true

      - name: Install Allure CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-jre > /dev/null
          curl -sLo allure.tgz https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -xzf allure.tgz
          sudo mv allure-2.27.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure

      - name: Generate Combined Allure Report
        run: |
          mkdir -p combined-results
          find allure-results -name "*.json" -exec cp {} combined-results/ \; 2>/dev/null || true
          find allure-results -name "*.txt" -exec cp {} combined-results/ \; 2>/dev/null || true
          find allure-results -name "*.png" -exec cp {} combined-results/ \; 2>/dev/null || true
          
          # Add environment info
          cat > combined-results/environment.properties << EOF
          Project=QA Portfolio - Bagas Dimas Saputra
          Web.Target=booking.kai.id
          API.Target=fakerestapi.azurewebsites.net
          Mobile.Target=saucedemo.com
          Framework.Web=Playwright (Python) + Selenium (Java)
          Framework.API=Playwright (Python) + Cypress (JS) + RestAssured (Java)
          Framework.Mobile=Playwright Device Emulation + Selenium Firefox Emulation
          Devices=iPhone 13, Pixel 7, Galaxy S21, iPad Pro
          CI=GitHub Actions
          EOF
          
          # Add categories for better grouping
          cat > combined-results/categories.json << 'EOF'
          [
            {"name": "API Tests", "matchedStatuses": ["passed", "failed"], "messageRegex": ".*api.*"},
            {"name": "Web Tests", "matchedStatuses": ["passed", "failed"], "messageRegex": ".*search.*|.*validation.*"},
            {"name": "Mobile Tests", "matchedStatuses": ["passed", "failed"], "messageRegex": ".*mobile.*|.*responsive.*"},
            {"name": "Product Defects", "matchedStatuses": ["failed"]},
            {"name": "Test Infrastructure", "matchedStatuses": ["broken"]}
          ]
          EOF
          
          allure generate combined-results -o public --clean

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
