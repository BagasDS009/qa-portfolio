[pytest]
markers =
    smoke: Core CRUD happy path
    wave1: All functional tests
    contract: Schema validation
    security: OWASP API Top 10
    performance: Response time budgets
    negative: Error handling
    auth: Authentication/authorization
    edge: Boundary values

addopts = --strict-markers --reruns=2 --reruns-delay=1 --alluredir=reports/allure-results
testpaths = tests
